name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la web de la app
        run: node tools/build-app.js
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}

      - name: Crear proyecto Android (primera vez)
        run: '[ -d android ] || npx cap add android'

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DeathZone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DeathZone APK (última versión)
          body: APK de depuración para instalar en Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
