<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Reinos de Plata</title>
<meta name="theme-color" content="#10141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script>
  // Instalable como app desde Chrome (solo en https y fuera de la app empaquetada)
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#10141a;color:#e8ecf1;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #login{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#10141aee;z-index:20}
  #login h1{margin:0;font-size:28px;letter-spacing:1px}
  #login input[type=password]{font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid #3a4658;background:#1a212b;color:#fff;width:240px;text-align:center;user-select:text;-webkit-user-select:text}
  #creator{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:10px;background:#10141af2;z-index:21;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px;touch-action:pan-y}
  #creator>*{flex-shrink:0}
  #prevc{position:static;inset:auto;width:170px;height:200px;border-radius:14px;background:linear-gradient(#1d2733,#2b3a2e);border:1px solid #3a4658}
  #powGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(340px,100%)}
  #powGrid button{text-align:left;padding:8px 10px;border-width:2px;font-size:13px}
  #powGrid button small{display:block;opacity:.75;font-size:11px}
  #powGrid button.on{background:#3b5278}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;max-width:340px;text-align:left;touch-action:manipulation}
  .chk input{margin-top:2px;width:18px;height:18px}
  .sw{display:flex;gap:10px;align-items:center;font-size:13px}
  .sw button{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid #ffffff33;margin-right:6px}
  .sw button.on{border-color:#fff}
  #bEnter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(200px + env(safe-area-inset-bottom));z-index:8;background:#4a6fa8;font-size:15px;padding:10px 18px;border-radius:20px}
  #login input{font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid #3a4658;background:#1a212b;color:#fff;width:240px;text-align:center;user-select:text;-webkit-user-select:text}
  button{font:inherit;color:#fff;background:#2b3a52;border:1px solid #4a5d7c;border-radius:10px;padding:10px 14px}
  button:active{background:#3b5278}
  #hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
  .bars{width:170px}
  .bar{height:12px;background:#0007;border-radius:6px;overflow:hidden;margin-bottom:4px;border:1px solid #fff2}
  .bar i{display:block;height:100%}
  #hp i{background:#d64545}#mp i{background:#3f7fe0}#xp i{background:#d9b13b}
  #info{font-size:13px;line-height:1.35;text-shadow:0 1px 2px #000}
  #zone{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:12px;background:#0008}
  #zone.red{background:#a11d1dcc}
  #chatlog{position:fixed;left:8px;bottom:calc(228px + env(safe-area-inset-bottom));width:min(60vw,320px);max-height:110px;overflow:hidden;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:5}
  #chatlog div{opacity:.9}
  #pad{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33;z-index:6;touch-action:none}
  #knob{position:absolute;width:56px;height:56px;border-radius:50%;background:#ffffff55;left:37px;top:37px}
  #btns{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:210px;height:160px;z-index:6}
  #btns button{position:absolute;width:60px;height:60px;border-radius:50%;padding:0;font-size:12px;background:#2b3a52cc;touch-action:none}
  #pbtns{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(160px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
  #pbtns button{width:56px;height:56px;border-radius:50%;padding:2px;font-size:11px;line-height:1.1;background:#2b3a52cc;border:3px solid #4a5d7c;touch-action:none;overflow:hidden;word-break:break-word}
  .pw-sel{width:100%}
  .tcap{padding:4px 0 8px}
  .tbr{margin:8px 0 14px;padding:10px 6px 6px;background:#1c2330;border:1px solid #3a4658;border-radius:12px}
  .tbr-t{text-align:center;font-weight:bold;letter-spacing:1px;margin-bottom:8px;color:#dfe6ee}
  .tgrid{display:flex;justify-content:space-around;gap:6px;flex-wrap:wrap}
  .tcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;flex:1 1 0}
  .tkids{display:flex;gap:6px;justify-content:center;border-top:2px solid #6b5a3a;padding-top:8px;margin-top:2px}
  .tn{position:relative;border-radius:50%;border:3px solid;background:#263041;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;flex:0 0 auto}
  .tlock{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:12px}
  .tlabel{font-size:12px;font-weight:bold;text-align:center}
  .tdesc{margin-top:8px;padding:10px;border:1px solid #6b5a3a;border-radius:10px;background:#2a2620}
  .pw-row{padding:6px 0;border-bottom:1px solid #ffffff12}
  .pw-mod{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:3px 0}
  .pw-mod button{padding:2px 10px;font-size:16px;line-height:1.2}
  .pw-bar{display:inline-block;min-width:22px;padding:1px 6px;border-radius:6px;background:#ffffff18;margin-right:3px}
  #topbtns{position:fixed;right:8px;top:calc(48px + env(safe-area-inset-top));display:flex;gap:6px;z-index:7}
  #topbtns button{padding:6px 10px;font-size:13px}
  #panel{position:fixed;inset:50px 10px 10px 10px;background:#161c26f2;border:1px solid #3a4658;border-radius:14px;z-index:15;display:none;flex-direction:column;max-width:560px;margin:0 auto}
  #panel .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
  #panel .tabs button{padding:8px 10px;font-size:13px}
  #panel .tabs button.on{background:#4a6fa8}
  #pbody{flex:1;overflow:auto;padding:8px 12px;font-size:14px;user-select:text;-webkit-user-select:text}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff12}
  .row small{color:#9aa7b8}
  #pbody input,#pbody select{font-size:14px;padding:6px;border-radius:8px;border:1px solid #3a4658;background:#1a212b;color:#fff;width:80px}
  #chatbox{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:none;z-index:25}
  #chatbox input{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid #4a5d7c;background:#1a212b;color:#fff;user-select:text;-webkit-user-select:text}
  #toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#000b;padding:10px 16px;border-radius:12px;z-index:30;display:none;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="login">
  <h1>⚔️ Reinos de Plata</h1>
  <div style="opacity:.8;font-size:14px;text-align:center;max-width:280px">Recolecta, fabrica, comercia y sobrevive en la zona de la muerte.</div>
  <input id="uname" maxlength="12" placeholder="Nombre de usuario" autocomplete="username">
  <input id="upass" type="password" maxlength="40" placeholder="Contraseña" autocomplete="current-password">
  <button id="bLogin" style="width:240px">Entrar</button>
  <button id="bReg" style="width:240px;background:#1f2a3a">Crear cuenta</button>
  <div id="loginErr" style="color:#ff8a8a;font-size:13px;text-align:center;max-width:260px"></div>
</div>
<div id="creator">
  <h2 style="margin:0">Crea tu personaje</h2>
  <canvas id="prevc" width="170" height="200"></canvas>
  <div style="font-size:13px;opacity:.8">Elige tu poder inicial (será tu primer poder, gratis)</div>
  <div id="powGrid"></div>
  <label class="chk"><input type="checkbox" id="auraChk" checked> El poder cambia mi aspecto (aura, cabello y ojos del color del elemento)</label>
  <div class="sw"><span>Piel</span><span id="toneSw"></span></div>
  <div class="sw"><span>Ropa</span><span id="clothSw"></span></div>
  <button id="mkChar" style="width:240px;background:#3b6b3b">Crear personaje</button>
  <div id="cErr" style="color:#ff8a8a;font-size:13px;text-align:center"></div>
</div>

<div id="hud">
  <div class="bars">
    <div class="bar" id="hp"><i style="width:100%"></i></div>
    <div class="bar" id="mp"><i style="width:100%"></i></div>
    <div class="bar" id="xp"><i style="width:0%"></i></div>
  </div>
  <div id="info"></div>
  <div id="zone">Ciudad segura</div>
</div>
<button id="bEnter" style="display:none"></button>
<div id="topbtns"><button id="bBag">🎒 Menú</button><button id="bChat">💬</button></div>
<div id="chatlog"></div>

<div id="pbtns"><button id="bP0">＋</button><button id="bP1">＋</button><button id="bP2">＋</button></div>
<div id="pad"><div id="knob"></div></div>
<div id="btns">
  <button id="bAtk"  style="right:0;bottom:50px;width:76px;height:76px;font-size:14px">⚔️<br>Atacar</button>
  <button id="bSk"   style="right:84px;bottom:90px">🌀<br>Tajo</button>
  <button id="bDash" style="right:92px;bottom:20px">💨<br>Dash</button>
  <button id="bGat"  style="right:150px;bottom:55px">⛏️<br>Recoger</button>
  <button id="bPot"  style="right:0;bottom:130px;width:48px;height:48px">🧪</button>
</div>

<div id="panel">
  <div class="tabs">
    <button data-tab="inv" class="on">Inventario</button>
    <button data-tab="craft">Crafteo</button>
    <button data-tab="market">Mercado</button>
    <button data-tab="powers">Poderes</button>
    <button data-tab="tree">Árbol</button>
    <button id="pclose" style="margin-left:auto">✕</button>
  </div>
  <div id="pbody"></div>
</div>
<div id="chatbox"><input id="chatin" maxlength="100" placeholder="Escribe y pulsa Enter..."></div>
<div id="toast"></div>

<script>
// ================== Configuración ==================
const TW = 64, TH = 32;
const NAMES = { wood: 'Madera', stone: 'Piedra', ore: 'Mineral', nucleo: 'Núcleo de maná', espada: 'Espada', armadura: 'Armadura', pocion: 'Poción' };
const TRADE = { wood: 'Leñador', stone: 'Cantero', ore: 'Minero' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
addEventListener('resize', resize); resize();

// ================== Estado ==================
let ws = null, myId = null, W = 100, H = 100, mapName = '', biome = 'city', safe = true, links = [], recipes = {}, items = [];
let resList = [], deadRes = new Set();
const players = new Map(), mobs = new Map();
let bags = [], fx = [], me = { inv: {}, silver: 0, xp: 0, lvl: 1, hp: 100, mh: 100, mp: 50, mm: 50, nx: 40 };
let market = [], zoomK = 1;
let cd = { sk: 0, dash: 0, atk: 0 };
let city = null, enterTab = null;
let pp = null, cdP = [0, 0, 0], prev = null, prevT = null, lastPSig = '';
let draft = { name: '', src: 'fuego', shape: 'proyectil', eff: 'dano', mods: { alcance: 0, potencia: 0, rapidez: 0, eficiencia: 0 } };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const srcCol = (k) => (pp && pp.parts.src[k] ? pp.parts.src[k].color : '#fff');

const BIOME = {
  city: { t: ['#8d8878', '#958f7e'], m: '#4a4638', leaf: ['#2e8b3e', '#3aa64c'] },
  death: { t: ['#6b3b36', '#703f3a'], m: '#5a2c28', leaf: ['#4f6b3a', '#5f7d44'] },
  forest: { t: ['#2f6f3a', '#357a42'], m: '#2c5a30', leaf: ['#1f7a3a', '#2fa352'] },
  ice: { t: ['#b9d6e6', '#c4deec'], m: '#6f96ad', leaf: ['#9fc9dd', '#cfe6f1'] },
  desert: { t: ['#c9a463', '#d1ac6b'], m: '#8c7240', leaf: ['#8aa04a', '#a3b85c'] },
  ruins: { t: ['#5b5470', '#625b78'], m: '#3d3750', leaf: ['#6b5f8a', '#8577a8'] },
};
const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });
function toast(m, t = 2200) { const e = document.getElementById('toast'); e.textContent = m; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', t); }

// ================== Conexión ==================
function show(id) { for (const k of ['login', 'creator']) document.getElementById(k).style.display = k === id ? 'flex' : 'none'; }
function connect(then) {
  if (ws && ws.readyState === 1) return then();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = window.SERVER_URL || (proto + '//' + location.host);
  ws = new WebSocket(url);
  ws.onopen = () => then();
  ws.onclose = () => { show('login'); document.getElementById('loginErr').textContent = 'Desconectado del servidor'; };
  ws.onmessage = (ev) => onMsg(JSON.parse(ev.data));
}
const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

function onMsg(m) {
  switch (m.t) {
    case 'init':
      myId = m.id; W = m.W; H = m.H; mapName = m.mapName; biome = m.biome; safe = m.safe; links = m.links || []; recipes = m.recipes; items = m.items; resList = m.res; pp = m.pp;
      players.clear(); mobs.clear(); bags = []; fx = []; deadRes = new Set();
      city = m.city; document.getElementById('login').style.display = 'none'; document.getElementById('creator').style.display = 'none'; break;
    case 'auth': pp = m.pp; window.myName = m.name; if (m.hasChar) send({ t: 'join' }); else showCreator(); break;
    case 'err':
      if (document.getElementById('creator').style.display === 'flex') document.getElementById('cErr').textContent = m.m;
      else { document.getElementById('loginErr').textContent = m.m; show('login'); }
      break;
    case 'me': me = m; hud(); powerBtns();
      if (panelOpen) { if (tab === 'powers') { if (powersSig() !== lastPSig) renderPanel(); } else renderPanel(); } break;
    case 'pprev': prev = m.r; updatePrev(); break;
    case 'market': market = m.list; if (panelOpen && tab === 'market') renderPanel(); break;
    case 'msg': toast(m.m); break;
    case 'chat': {
      const d = document.createElement('div'); d.textContent = m.n + ': ' + m.m;
      const l = document.getElementById('chatlog'); l.appendChild(d); while (l.children.length > 6) l.removeChild(l.firstChild);
      setTimeout(() => d.remove(), 12000); break;
    }
    case 's': {
      const seen = new Set();
      for (const p of m.p) {
        seen.add(p.id); let o = players.get(p.id);
        if (!o) { o = { rx: p.x, ry: p.y }; players.set(p.id, o); }
        Object.assign(o, p);
      }
      for (const id of players.keys()) if (!seen.has(id)) players.delete(id);
      const seenM = new Set();
      for (const q of m.m) {
        seenM.add(q.id); let o = mobs.get(q.id);
        if (!o) { o = { rx: q.x, ry: q.y }; mobs.set(q.id, o); }
        Object.assign(o, q);
      }
      for (const id of mobs.keys()) if (!seenM.has(id)) mobs.delete(id);
      deadRes = new Set(m.d); bags = m.b;
      for (const e of m.e) fx.push({ ...e, born: performance.now() });
      break;
    }
  }
}

// ================== Entrada ==================
let kx = 0, ky = 0, jx = 0, jy = 0, lastSent = '';
const keys = {};
addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') {
    if (e.key === 'Enter' && document.activeElement.id === 'chatin') { const v = e.target.value.trim(); if (v) send({ t: 'chat', m: v }); e.target.value = ''; closeChat(); }
    if (e.key === 'Escape') closeChat();
    return;
  }
  keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'j') act('atk'); if (k === 'k') act('sk'); if (k === 'l') act('dash');
  if (k === '1' || k === '2' || k === '3') act('p' + (+k - 1)); if (k === 'e') act('gather'); if (k === 'q') act('potion'); if (k === 'b') togglePanel(); if (k === 'enter') openChat();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
function act(a) {
  const n = performance.now();
  if (a === 'atk') send({ t: 'atk' });
  if (a === 'sk') { send({ t: 'sk' }); cd.sk = n + 3000; }
  if (a === 'dash') { send({ t: 'dash' }); cd.dash = n + 4000; }
  if (a === 'gather') send({ t: 'gather' });
  if (a === 'potion') send({ t: 'potion' });
  if (a.length === 2 && a[0] === 'p') castSlot(+a[1]);
}
function castSlot(i) {
  const idx = me.bar && me.bar[i], d = idx != null && me.pw ? me.pw[idx] : null;
  if (!d) { if (!panelOpen) togglePanel(); tab = 'powers'; syncTabs(); renderPanel(); return; }
  send({ t: 'pcast', slot: i }); cdP[i] = performance.now() + d.st.cd;
}
// pantalla -> mundo
function scr2world(sx, sy) { const x = (sx / (TW / 2) + sy / (TH / 2)) / 2, y = (sy / (TH / 2) - sx / (TW / 2)) / 2; const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }
function updateInput() {
  let sx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let sy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (!sx && !sy) { sx = jx; sy = jy; }
  let dx = 0, dy = 0;
  if (Math.hypot(sx, sy) > 0.15) { const l = Math.hypot(sx, sy), mag = Math.min(1, l); [dx, dy] = scr2world(sx / l, sy / l); dx *= mag; dy *= mag; }
  const s = dx.toFixed(2) + ',' + dy.toFixed(2);
  if (s !== lastSent) { lastSent = s; send({ t: 'in', dx, dy }); }
}
setInterval(() => { updateInput(); if (lastSent !== '0.00,0.00') send({ t: 'in', dx: +lastSent.split(',')[0], dy: +lastSent.split(',')[1] }); }, 200);

// joystick táctil
const pad = document.getElementById('pad'), knob = document.getElementById('knob');
let padId = null;
function padMove(e) {
  const r = pad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy; const m = r.width / 2, l = Math.hypot(dx, dy);
  if (l > m) { dx = dx / l * m; dy = dy / l * m; }
  jx = dx / m; jy = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
}
pad.addEventListener('pointerdown', (e) => { padId = e.pointerId; pad.setPointerCapture(padId); padMove(e); });
pad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) padMove(e); });
const padEnd = (e) => { if (e.pointerId === padId) { padId = null; jx = jy = 0; knob.style.transform = ''; } };
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);

// botones de acción (mantener pulsado = repetir)
function bind(id, a, repeat) {
  const b = document.getElementById(id); let t = null;
  const start = (e) => { e.preventDefault(); act(a); if (repeat) t = setInterval(() => act(a), 250); };
  const stop = () => { clearInterval(t); t = null; };
  b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
}
bind('bP0', 'p0'); bind('bP1', 'p1'); bind('bP2', 'p2'); bind('bAtk', 'atk', true); bind('bSk', 'sk'); bind('bDash', 'dash'); bind('bGat', 'gather', true); bind('bPot', 'potion');

function openChat() { const b = document.getElementById('chatbox'); b.style.display = 'block'; document.getElementById('chatin').focus(); }
function closeChat() { document.getElementById('chatbox').style.display = 'none'; document.getElementById('chatin').blur(); }
document.getElementById('bChat').onclick = openChat;
document.getElementById('bEnter').onclick = () => {
  if (!enterTab) return;
  if (!panelOpen) togglePanel();
  tab = enterTab; syncTabs(); if (tab === 'powers') { prev = null; reqPrev(); } renderPanel();
};
document.getElementById('bBag').onclick = () => togglePanel();

// ================== Panel (inventario / crafteo / mercado) ==================
let panelOpen = false, tab = 'inv';
const panel = document.getElementById('panel'), pbody = document.getElementById('pbody');
function togglePanel() { panelOpen = !panelOpen; panel.style.display = panelOpen ? 'flex' : 'none'; if (panelOpen) renderPanel(); }
document.getElementById('pclose').onclick = togglePanel;
function syncTabs() { panel.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x.dataset.tab === tab)); }

// ================== Render ==================
function hashColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return `hsl(${Math.abs(h) % 360},65%,55%)`; }
function diamond(sx, sy, fill) {
  ctx.beginPath(); ctx.moveTo(sx, sy - TH / 2); ctx.lineTo(sx + TW / 2, sy); ctx.lineTo(sx, sy + TH / 2); ctx.lineTo(sx - TW / 2, sy); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
function bar(sx, sy, w, p, col) { ctx.fillStyle = '#000a'; ctx.fillRect(sx - w / 2, sy, w, 5); ctx.fillStyle = col; ctx.fillRect(sx - w / 2, sy, w * Math.max(0, Math.min(1, p)), 5); }

function drawBody(c, x, y, look, t, sw, fallbackName) {
  const col = look && look.au ? srcCol(look.pw) : null;
  const cloth = look ? CLOTHS[look.cl % CLOTHS.length] : hashColor(fallbackName);
  const tone = look ? TONES[look.tn % TONES.length] : '#f1d3b0';
  if (col) {                                   // el poder cambia el aspecto: aura con chispas, cabello y ojos del elemento
    const g = c.createRadialGradient(x, y - 18, 4, x, y - 18, 34);
    g.addColorStop(0, col + '66'); g.addColorStop(1, col + '00');
    c.fillStyle = g; c.beginPath(); c.arc(x, y - 18, 34, 0, 7); c.fill();
    c.fillStyle = col;
    for (let i = 0; i < 4; i++) { const a = t / 600 + i * 1.57; c.fillRect(x + Math.cos(a) * 18 - 1, y - 20 + Math.sin(a) * 10 - 1 - ((t / 40 + i * 9) % 12), 3, 3); }
  }
  c.fillStyle = cloth; c.fillRect(x - 8, y - 28, 16, 24);
  c.fillStyle = tone; c.beginPath(); c.arc(x, y - 34, 8, 0, 7); c.fill();
  c.fillStyle = col || '#4a3321'; c.beginPath(); c.arc(x, y - 36, 8.5, Math.PI, 0); c.fill(); c.fillRect(x - 8.5, y - 37, 17, 3);
  c.fillStyle = col ? '#fff' : '#222'; c.fillRect(x - 4, y - 34, 2, 2); c.fillRect(x + 2, y - 34, 2, 2);
  if (sw) { c.strokeStyle = '#dfe6ee'; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 10, y - 16); c.lineTo(x + 20, y - 36); c.stroke(); }
}
function drawBld(b) {
  const P = [iso(b.x, b.y), iso(b.x + b.w, b.y), iso(b.x + b.w, b.y + b.d), iso(b.x, b.y + b.d)];
  const T = P.map((q) => ({ x: q.x, y: q.y - b.h }));
  const poly = (pts, f) => { ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.closePath(); ctx.fillStyle = f; ctx.fill(); };
  poly(P, '#0004');
  poly([P[3], P[2], T[2], T[3]], '#6c6358'); poly([P[2], P[1], T[1], T[2]], '#554d44');
  if (b.id !== 'puerta') {
    poly(T, b.roof);
    const c = { x: (T[0].x + T[2].x) / 2, y: (T[0].y + T[2].y) / 2 };
    ctx.fillStyle = '#1b1410'; ctx.fillRect((P[2].x + P[3].x) / 2 - 5, P[2].y - 20, 10, 18);
    ctx.fillStyle = b.roof; ctx.beginPath(); ctx.moveTo(c.x, c.y - 22); ctx.lineTo(c.x + 7, c.y - 12); ctx.lineTo(c.x - 7, c.y - 12); ctx.fill();
  } else {
    ctx.fillStyle = '#ff5533'; ctx.globalAlpha = 0.5 + 0.2 * Math.sin(performance.now() / 300); poly([P[3], P[2], T[2], T[3]], '#3a0d0d'); ctx.globalAlpha = 1;
  }
  const lab = { x: (T[0].x + T[2].x) / 2, y: Math.min(T[0].y, T[1].y) - 4 };
  ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
  ctx.strokeText(b.name, lab.x, lab.y); ctx.fillText(b.name, lab.x, lab.y);
}
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  updateInput();
  const k = 1 - Math.pow(0.0005, dt); // suavizado
  for (const o of players.values()) { o.rx += (o.x - o.rx) * k; o.ry += (o.y - o.ry) * k; }
  for (const o of mobs.values()) { o.rx += (o.x - o.rx) * k; o.ry += (o.y - o.ry) * k; }
  draw(t);
  requestAnimationFrame(frame);
}

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#10141a'; ctx.fillRect(0, 0, VW, VH);
  const mp = players.get(myId);
  if (!mp) return;
  const sc = Math.max(0.7, Math.min(1.3, Math.min(VW, VH) / 520)) * zoomK;
  const cam = iso(mp.rx, mp.ry);
  ctx.save(); ctx.translate(VW / 2, VH / 2); ctx.scale(sc, sc); ctx.translate(-cam.x, -cam.y);

  // tiles visibles
  const R = Math.ceil(Math.max(VW, VH) / sc / TH) + 3;
  const cx = Math.floor(mp.rx), cy = Math.floor(mp.ry);
  for (let ty = cy - R; ty <= cy + R; ty++) for (let tx = cx - R; tx <= cx + R; tx++) {
    if (tx < 0 || ty < 0 || tx >= W || ty >= H) continue;
    const p = iso(tx + 0.5, ty + 0.5); const sx = p.x, sy = p.y;
    if (Math.abs(sx - cam.x) > VW / sc / 2 + TW || Math.abs(sy - cam.y) > VH / sc / 2 + TH) continue;
    const chk = (tx + ty) & 1;
    const bm = BIOME[biome] || BIOME.death;
    let col = chk ? bm.t[0] : bm.t[1];
    for (const l of links) {                                   // franja dorada en los bordes que llevan a otro mapa
      const ax = l.side === 'e' || l.side === 'w' ? ty : tx;
      if (l.min != null && (ax < l.min || ax > l.max)) continue;
      if ((l.side === 'e' && tx >= W - 2) || (l.side === 'w' && tx < 2) || (l.side === 's' && ty >= H - 2) || (l.side === 'n' && ty < 2)) col = chk ? '#c9a227' : '#b8921f';
    }
    diamond(sx, sy, col);
  }

  // entidades ordenadas por profundidad
  const ents = [];
  for (const b of (city ? city.buildings : [])) ents.push({ z: b.x + b.y + (b.w + b.d) / 2, k: 'bld', o: b });
  for (const r of resList) if (!deadRes.has(r.id) && Math.abs(r.x - cx) <= R && Math.abs(r.y - cy) <= R) ents.push({ z: r.x + r.y, k: 'res', o: r });
  for (const b of bags) ents.push({ z: b.x + b.y, k: 'bag', o: b });
  for (const m of mobs.values()) ents.push({ z: m.rx + m.ry, k: 'mob', o: m });
  for (const p of players.values()) ents.push({ z: p.rx + p.ry, k: 'pl', o: p });
  ents.sort((a, b) => a.z - b.z);
  for (const e of ents) {
    const o = e.o;
    if (e.k === 'bld') drawBld(o); else if (e.k === 'res') drawRes(o); else if (e.k === 'bag') drawBag(o, t); else if (e.k === 'mob') drawMob(o, t); else drawPlayer(o, t);
  }
  // efectos
  const now = performance.now();
  fx = fx.filter((f) => now - f.born < 900);
  for (const f of fx) {
    const age = (now - f.born) / 900, p = iso(f.x, f.y);
    if (f.t === 'dmg' || f.t === 'heal') {
      ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = f.t === 'heal' ? `rgba(120,255,140,${1 - age})` : `rgba(255,235,90,${1 - age})`;
      ctx.strokeStyle = `rgba(0,0,0,${1 - age})`; ctx.lineWidth = 3;
      const txt = (f.t === 'heal' ? '+' : '-') + f.v; ctx.strokeText(txt, p.x, p.y - 40 - age * 30); ctx.fillText(txt, p.x, p.y - 40 - age * 30);
    } else if (f.t === 'slash') {
      ctx.strokeStyle = `rgba(160,220,255,${1 - age})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(p.x, p.y, 2.8 * TW / 2 * (0.4 + age), 2.8 * TH / 2 * (0.4 + age), 0, 0, 7); ctx.stroke();
    } else if (f.t === 'chop') {
      ctx.fillStyle = `rgba(255,255,255,${1 - age})`; for (let i = 0; i < 4; i++) ctx.fillRect(p.x - 12 + i * 8, p.y - 30 - age * 12 * (i % 2 + 1), 3, 3);
    } else if (f.t === 'pw') {
      const col = srcCol(f.src), al = 1 - age;
      ctx.save(); ctx.globalAlpha = Math.max(0, al); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 4;
      if (f.sh === 'area') {
        const k = Math.min(1, 0.25 + age * 1.2); ctx.beginPath(); ctx.ellipse(p.x, p.y, f.r * TW / 2 * 1.414 * k, f.r * TH / 2 * 1.414 * k, 0, 0, 7); ctx.stroke();
        ctx.globalAlpha = Math.max(0, al) * 0.2; ctx.fill();
      } else {
        if (f.sh === 'cono') {
          const a0 = Math.atan2(f.dy, f.dx); ctx.beginPath(); ctx.moveTo(p.x, p.y);
          for (let i = -4; i <= 4; i++) { const an = a0 + i * 0.14, q = iso(f.x + Math.cos(an) * f.r, f.y + Math.sin(an) * f.r); ctx.lineTo(q.x, q.y); }
          ctx.closePath(); ctx.globalAlpha = Math.max(0, al) * 0.3; ctx.fill(); ctx.globalAlpha = Math.max(0, al); ctx.stroke();
        }
        for (const t of f.tg || []) {
          const q = iso(t[0], t[1]); ctx.beginPath(); ctx.moveTo(p.x, p.y - 18); ctx.lineTo(q.x, q.y - 14); ctx.stroke();
          ctx.beginPath(); ctx.arc(q.x, q.y - 14, 6 + age * 10, 0, 7); ctx.fill();
        }
      }
      ctx.restore();
    } else if (f.t === 'death') {
      ctx.fillStyle = `rgba(255,60,60,${1 - age})`; ctx.font = '22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('☠', p.x, p.y - 20 - age * 30);
    }
  }
  ctx.restore();

  // minimapa
  const mw = 90, mx = VW - mw - 8, my = VH - mw - 190; // sobre los botones
  if (VH > 420) {
    ctx.fillStyle = '#0009'; ctx.fillRect(mx, my, mw, mw);
    ctx.fillStyle = (BIOME[biome] || BIOME.death).m; ctx.fillRect(mx, my, mw, mw);
    ctx.fillStyle = '#c9a227';
    for (const l of links) { const a = l.min != null ? (l.min / (l.side === 'e' || l.side === 'w' ? H : W)) * mw : 0, b = l.min != null ? ((l.max - l.min) / (l.side === 'e' || l.side === 'w' ? H : W)) * mw : mw;
      if (l.side === 'e') ctx.fillRect(mx + mw - 2, my + a, 2, b); else if (l.side === 'w') ctx.fillRect(mx, my + a, 2, b); else if (l.side === 's') ctx.fillRect(mx + a, my + mw - 2, b, 2); else ctx.fillRect(mx + a, my, b, 2); }
    for (const p of players.values()) { ctx.fillStyle = p.id === myId ? '#fff' : '#6cf'; ctx.fillRect(mx + p.x / W * mw - 1, my + p.y / H * mw - 1, 3, 3); }
  }
  // cooldowns en botones
  const n = performance.now();
  document.getElementById('bSk').style.opacity = n < cd.sk ? .45 : 1;
  document.getElementById('bDash').style.opacity = n < cd.dash ? .45 : 1;
  for (let i = 0; i < 3; i++) document.getElementById('bP' + i).style.opacity = n < cdP[i] ? .45 : 1;
  const nb = city && city.buildings.find((b) => b.tab && mp.rx >= b.x - 2.5 && mp.rx <= b.x + b.w + 2.5 && mp.ry >= b.y - 2.5 && mp.ry <= b.y + b.d + 2.5);
  const eb = document.getElementById('bEnter');
  if (nb) { enterTab = nb.tab; eb.textContent = 'Entrar: ' + nb.name; eb.style.display = 'block'; } else { enterTab = null; eb.style.display = 'none'; }
  const zEl = document.getElementById('zone'), red = !safe;
  zEl.textContent = (red ? '⚠ ' : '') + mapName; zEl.classList.toggle('red', red);
}

function flagIcons(x, y, fl) { if (!fl) return; ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(fl & 2 ? '❄️' : '', x, y); }
function drawRes(r) {
  const p = iso(r.x, r.y);
  ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 14, 7, 0, 0, 7); ctx.fill();
  if (r.t === 'tree') {
    ctx.fillStyle = '#5b3a1e'; ctx.fillRect(p.x - 4, p.y - 22, 8, 22);
    const lf = (BIOME[biome] || BIOME.death).leaf;
    ctx.fillStyle = lf[0]; ctx.beginPath(); ctx.arc(p.x, p.y - 32, 17, 0, 7); ctx.fill();
    ctx.fillStyle = lf[1]; ctx.beginPath(); ctx.arc(p.x - 5, p.y - 36, 9, 0, 7); ctx.fill();
  } else if (r.t === 'rock') {
    ctx.fillStyle = '#8a8f98'; ctx.beginPath(); ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x - 8, p.y - 16); ctx.lineTo(p.x + 6, p.y - 18); ctx.lineTo(p.x + 14, p.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#aab0ba'; ctx.beginPath(); ctx.moveTo(p.x - 8, p.y - 16); ctx.lineTo(p.x + 6, p.y - 18); ctx.lineTo(p.x, p.y - 8); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#4a4e57'; ctx.beginPath(); ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x - 8, p.y - 16); ctx.lineTo(p.x + 6, p.y - 18); ctx.lineTo(p.x + 14, p.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f2c94c'; for (const [dx, dy] of [[-6, -8], [2, -12], [6, -5]]) ctx.fillRect(p.x + dx, p.y + dy, 4, 4);
  }
}
function drawBag(b, t) {
  const p = iso(b.x, b.y), bob = Math.sin(t / 250) * 2;
  ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 10, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#a0713a'; ctx.beginPath(); ctx.arc(p.x, p.y - 8 + bob, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#d4a85a'; ctx.fillRect(p.x - 3, p.y - 20 + bob, 6, 5);
}
function drawMob(m, t) {
  const p = iso(m.rx, m.ry);
  ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 15, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a7f88'; ctx.beginPath(); ctx.ellipse(p.x, p.y - 10, 14, 9, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + 10, p.y - 16, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff4040'; ctx.fillRect(p.x + 11, p.y - 18, 3, 3);
  bar(p.x, p.y - 32, 30, m.hp / m.mh, '#d64545'); flagIcons(p.x, p.y - 38, m.fl);
}
function drawPlayer(o, t) {
  const p = iso(o.rx, o.ry), mine = o.id === myId;
  ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 14, 7, 0, 0, 7); ctx.fill();
  if (mine) { ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(p.x, p.y, 17, 9, 0, 0, 7); ctx.stroke(); }
  drawBody(ctx, p.x, p.y, o.lk ? { pw: o.lk[0], au: o.lk[1], tn: o.lk[2], cl: o.lk[3] } : null, t, o.sw, o.n);
  ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
  const label = o.n + ' [' + o.l + ']'; ctx.strokeText(label, p.x, p.y - 56); ctx.fillStyle = mine ? '#ffe27a' : '#fff'; ctx.fillText(label, p.x, p.y - 56);
  bar(p.x, p.y - 51, 34, o.hp / o.mh, '#4cc35a'); flagIcons(p.x, p.y - 62, o.fl);
}
requestAnimationFrame(frame);

// zoom con rueda
addEventListener('wheel', (e) => { zoomK = Math.max(0.6, Math.min(1.8, zoomK * (e.deltaY < 0 ? 1.08 : 0.92))); }, { passive: true });
</script>
