  .pw-sel{width:100%}
  .tnode{margin:6px 0 6px 4px;padding-left:10px}
  .tkid{margin-left:14px;padding:3px 0;font-size:13px;color:#7c8798;border-left:1px dashed #ffffff30;padding-left:10px}
  .pw-row{padding:6px 0;border-bottom:1px solid #ffffff12}
  .pw-mod{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:3px 0}
  .pw-mod button{padding:2px 10px;font-size:16px;line-height:1.2}
  .pw-bar{display:inline-block;min-width:22px;padding:1px 6px;border-radius:6px;background:#ffffff18;margin-right:3px}
  #topbtns{position:fixed;right:8px;top:calc(48px + env(safe-area-inset-top));display:flex;gap:6px;z-index:7}
  #topbtns button{padding:6px 10px;font-size:13px}
  #panel{position:fixed;inset:50px 10px 10px 10px;background:#161c26f2;border:1px solid #3a4658;border-radius:14px;z-index:15;display:none;flex-direction:column;max-width:560px;margin:0 auto}
  #panel .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px}

  #pbody{flex:1;overflow:auto;padding:8px 12px;font-size:14px;user-select:text;-webkit-user-select:text}

  #chatbox input{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid #4a5d7c;background:#1a212b;color:#fff;user-select:text;-webkit-user-select:text}
  #toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#000b;padding:10px 16px;border-radius:12px;z-index:30;display:none;text-align:center}
</style>

<script>
(function(){
const Pw = (function(){ const module = { exports: {} };
// Reglas de los poderes personalizados (la forja). Solo lógica pura, sin estado del juego:
// la usan el servidor, la versión sin conexión y tools/balance-check.js.
// Un poder = fuente + forma + efecto + hasta 3 niveles de 4 modificadores.
// Todo lo que se puede elegir cuesta puntos, y el presupuesto de puntos sube con el nivel.

const PARTS = {
  src: {
    fuego:    { name: 'Fuego',        cost: 2, dmg: 1.15, cd: 1.1,  mp: 1.0, color: '#ff7a2e', ico: '🔥' },
    hielo:    { name: 'Hielo',        cost: 2, dmg: 0.9,  cd: 1.0,  mp: 0.9, slow: 0.45, color: '#8fd8ff', ico: '❄️' },
    rayo:     { name: 'Electricidad', cost: 2, dmg: 0.95, cd: 0.85, mp: 1.1, color: '#f5e65a', ico: '⚡' },
    tierra:   { name: 'Tierra',       cost: 2, dmg: 0.95, cd: 1.05, mp: 1.0, push: 1.0, color: '#b08a4e', ico: '⛰️' },
    sangre:   { name: 'Sangre',       cost: 3, dmg: 1.0,  cd: 1.0,  mp: 0.7, hpcost: 0.06, color: '#c0283c', ico: '🩸' },
    gravedad: { name: 'Gravedad',     cost: 3, dmg: 0.8,  cd: 1.0,  mp: 1.0, push: 1.5, color: '#9a7aff', ico: '🌑' },
  },
  shape: {
    proyectil: { name: 'Proyectil', cost: 2, range: 7,   cd: 2600, mp: 12, dmg: 1.3, n: 1 },
    cono:      { name: 'Cono',      cost: 3, range: 3.6, cd: 3200, mp: 16, dmg: 1.1, n: 4 },
    area:      { name: 'Área',      cost: 4, range: 2.8, cd: 4200, mp: 22, dmg: 0.9, n: 99 },
  },
  eff: {
    dano:       { name: 'Daño',       cost: 1, dmg: 1.0 },
    ralentizar: { name: 'Ralentizar', cost: 2, dmg: 0.55, slow: 2500 },
    empujar:    { name: 'Empujar',    cost: 2, dmg: 0.55, push: 2.5 },
    robarVida:  { name: 'Robar vida', cost: 3, dmg: 0.75, leech: 0.5 },
    curar:      { name: 'Curar',      cost: 2, dmg: 0,    heal: 0.22 },
  },
  mod: {
    alcance:    { name: 'Alcance',    desc: '+20% de alcance por nivel' },
    potencia:   { name: 'Potencia',   desc: '+15% de efecto y +4 de energía por nivel' },
    rapidez:    { name: 'Rapidez',    desc: '-12% de enfriamiento por nivel' },
    eficiencia: { name: 'Eficiencia', desc: '-12% de energía por nivel' },
  },
};

const MOD_MAX = 3;
const MOD_COST = [0, 1, 3, 7];   // costo acumulado por nivel: rendimientos decrecientes
const POWER_MIN_CD = 2000;       // ningún poder se repite en menos de 2 s
const POWER_GCD = 900;           // entre dos poderes cualquiera pasan al menos 0,9 s
const POWER_DMG_CAP = 0.4;       // un golpe nunca pasa del 40% de la vida máxima de alguien de tu nivel
const POWER_HEAL_CAP = 0.3;      // una cura nunca pasa del 30% de la vida máxima
const PVP_MUL = 0.6;             // contra otros jugadores los poderes hacen 40% menos
const MAX_POWERS = 6;
const FORGE_COST = { nucleo: 1, silver: 10 };

const FORJA_REFUND = 0.3;        // habilidad de ayuda Forja: 30% de recuperar los materiales al fabricar

// Árbol de habilidades. `on: true` = ya funciona; `on: false` = rama de relleno, todavía sin función.
const TREE = [
  { id: 'elem', name: 'Elementos', nodes: [
    { id: 'fuego', name: 'Fuego', src: 'fuego', on: true, desc: 'Más daño directo.', kids: ['Llamarada', 'Infierno'] },
    { id: 'hielo', name: 'Hielo', src: 'hielo', on: true, desc: 'Ralentiza a quien golpea.', kids: ['Escarcha', 'Ventisca'] },
    { id: 'tierra', name: 'Tierra', src: 'tierra', on: true, desc: 'Golpe pesado que empuja.', kids: ['Muro', 'Terremoto'] },
    { id: 'rayo', name: 'Rayo', src: 'rayo', on: true, desc: 'Recarga rápida.', kids: ['Cadena', 'Tormenta'] },
  ] },
  { id: 'apoyo', name: 'Apoyo', nodes: [
    { id: 'forja', name: 'Forja', on: true, desc: 'Al fabricar tienes 30% de recuperar los materiales.', kids: ['Maestría', 'Aleaciones'] },
    { id: 'teleport', name: 'Teletransportación', on: false, desc: 'Próximamente.', kids: ['Salto corto', 'Salto largo'] },
  ] },
];

const powerBudget = (lvl) => Math.min(40, 10 + lvl);

function cleanPower(d) {
  if (!d || !PARTS.src[d.src] || !PARTS.shape[d.shape] || !PARTS.eff[d.eff]) return null;
  const mods = {};
  for (const k in PARTS.mod) {
    const v = Math.floor(+(d.mods && d.mods[k]) || 0);
    if (v < 0 || v > MOD_MAX) return null;
    mods[k] = v;
  }
  const name = String(d.name || '').replace(/[^\p{L}\p{N}_\- ]/gu, '').trim().slice(0, 14);
  return { name, src: d.src, shape: d.shape, eff: d.eff, mods };
}

const defaultPowerName = (c) => PARTS.src[c.src].name + ' ' + PARTS.shape[c.shape].name;

const powerCost = (c) =>
  PARTS.src[c.src].cost + PARTS.shape[c.shape].cost + PARTS.eff[c.eff].cost +
  Object.keys(c.mods).reduce((s, k) => s + MOD_COST[c.mods[k]], 0);

function powerStats(c, lvl) {
  const S = PARTS.src[c.src], SH = PARTS.shape[c.shape], E = PARTS.eff[c.eff], m = c.mods;
  const mhp = 100 + (lvl - 1) * 10;
  let dmg = (16 + lvl * 4) * S.dmg * SH.dmg * E.dmg * (1 + 0.15 * m.potencia);
  dmg = Math.min(dmg, POWER_DMG_CAP * mhp);
  const cd = Math.max(POWER_MIN_CD, Math.round(SH.cd * S.cd * (1 - 0.12 * m.rapidez)));
  const mp = Math.max(6, Math.round((SH.mp * S.mp + 4 * m.potencia) * (1 - 0.12 * m.eficiencia) * (1 + 0.04 * (lvl - 1))));
  const range = +(SH.range * (1 + 0.2 * m.alcance)).toFixed(1);
  const heal = E.heal ? Math.min(POWER_HEAL_CAP, E.heal * (1 + 0.15 * m.potencia)) : 0;
  return { dmg: Math.round(dmg), cd, mp, range, heal: +heal.toFixed(2), hpcost: S.hpcost || 0 };
}

module.exports = { TREE, FORJA_REFUND, PARTS, MOD_MAX, MOD_COST, POWER_MIN_CD, POWER_GCD, POWER_DMG_CAP, POWER_HEAL_CAP, PVP_MUL, MAX_POWERS, FORGE_COST,
  powerBudget, cleanPower, defaultPowerName, powerCost, powerStats };

return module.exports; })();
const W = 100, H = 100;      // tamaño del mundo en tiles
const SAFE_X = 30;           // x < SAFE_X = ciudad segura; x >= SAFE_X = zona de la muerte (PvP + full loot)
const TICK = 50;             // 20 Hz
const SPEED = 4.5;           // tiles/seg

const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let accounts = {}, listings = [];
try { const d = JSON.parse(store.get('rp_offline_data') || '{}'); accounts = d.accounts || {}; listings = d.listings || []; nextId = d.nextId || 1; } catch(e){}
function save(){ store.set('rp_offline_data', JSON.stringify({ accounts, listings, nextId })); }
setInterval(save, 10000);
addEventListener('pagehide', save);
function getAcct(name){ if (!accounts[name]) accounts[name] = { name, inv: {}, silver: 20, xp: 0, lvl: 1 }; const a = accounts[name];
  if (!a.starter) { a.starter = true; a.inv.nucleo = (a.inv.nucleo || 0) + 1; } return a; }
const RECIPES = {
  espada:   { wood: 4, ore: 3 },     // +12 de daño
  armadura: { stone: 6, ore: 2 },    // -30% daño recibido
  pocion:   { wood: 3, stone: 1 },   // cura 60 HP
};
const ITEMS = ['wood', 'stone', 'ore', 'nucleo', 'espada', 'armadura', 'pocion'];

// ---------- utilidades ----------
let seed = 1337;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const inRed = (x) => x >= SAFE_X;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let nextId = 1;
const newId = () => nextId++;


// ---------- mundo ----------
const resources = [];
function spawnRes(type, n, minX, maxX) {
  for (let i = 0; i < n; i++) {
    resources.push({
      id: newId(), t: type,
      x: minX + rnd() * (maxX - minX), y: 2 + rnd() * (H - 4),
      hp: type === 'ore' ? 4 : 3, alive: true, respawn: 0,
    });
  }
}
spawnRes('tree', 110, 3, W - 2);
spawnRes('rock', 70, 3, W - 2);
spawnRes('ore', 60, SAFE_X + 3, W - 2);

const mobs = [];
for (let i = 0; i < 28; i++) {
  const x = SAFE_X + 8 + rnd() * (W - SAFE_X - 12), y = 4 + rnd() * (H - 8);
  mobs.push({ id: newId(), x, y, hx: x, hy: y, hp: 60, mhp: 60, alive: true, respawn: 0, cd: 0 });
}
const bags = []; // bolsas de loot {id,x,y,items,silver,expires}
const players = new Map(); // ws -> player
let events = [];

const spawnPoint = () => ({ x: 8 + rnd() * 4, y: 48 + rnd() * 4 });

// ---------- jugador ----------
const mhpOf = (a) => 100 + (a.lvl - 1) * 10;
const mmpOf = (a) => 50 + (a.lvl - 1) * 5;
const baseDmg = (p) => 10 + p.acct.lvl * 2 + ((p.acct.inv.espada || 0) > 0 ? 12 : 0);

function send(ws, obj) { if (ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function broadcast(obj) { const s = JSON.stringify(obj); for (const ws of players.keys()) if (ws.readyState === 1) ws.send(s); }

function addXp(p, n) {
  const a = p.acct; a.xp += n;
  while (a.xp >= a.lvl * 40) { a.xp -= a.lvl * 40; a.lvl++; p.hp = mhpOf(a); p.mp = mmpOf(a); }
  p.dirty = true;
}
function addItem(a, item, n) { a.inv[item] = (a.inv[item] || 0) + n; if (a.inv[item] <= 0) delete a.inv[item]; }

function respawn(p) {
  const s = spawnPoint(); p.x = s.x; p.y = s.y; p.slowUntil = 0;
  p.hp = mhpOf(p.acct); p.mp = mmpOf(p.acct); p.dirty = true;
}
function killPlayer(p, killer) {
  const a = p.acct;
  if (inRed(p.x)) {
    const loot = { ...a.inv };
    const silver = Math.floor(a.silver / 2);
    if (Object.keys(loot).length || silver) {
      bags.push({ id: newId(), x: p.x, y: p.y, items: loot, silver, expires: Date.now() + 120000 });
    }
    a.inv = {}; a.silver -= silver;
  }
  p.deaths = (p.deaths || 0) + 1;
  events.push({ t: 'death', x: p.x, y: p.y });
  send(p.ws, { t: 'msg', m: 'Has muerto. Has perdido tu inventario en la zona de la muerte.' });
  if (killer && killer.acct) addXp(killer, 20);
  respawn(p);
}
function hurtPlayer(p, amt, killer) {
  if (p.acct.inv.armadura > 0) amt = Math.round(amt * 0.7);
  p.hp -= amt; p.dirty = true;
  events.push({ t: 'dmg', x: p.x, y: p.y, v: amt });
  if (p.hp <= 0) killPlayer(p, killer);
}
function hurtMob(m, amt, killer) {
  m.hp -= amt;
  events.push({ t: 'dmg', x: m.x, y: m.y, v: amt });
  if (m.hp <= 0) {
    m.alive = false; m.respawn = Date.now() + 15000;
    const s = 5 + Math.floor(rnd() * 11);
    killer.acct.silver += s; addXp(killer, 8); killer.dirty = true;
    if (rnd() < 0.3) addItem(killer.acct, 'nucleo', 1); // los núcleos solo salen de los monstruos de la zona de la muerte
  }
}
function enemiesNear(p, r) {
  const out = [];
  for (const m of mobs) if (m.alive && dist(p, m) <= r) out.push({ kind: 'mob', e: m, d: dist(p, m) });
  if (inRed(p.x)) {
    for (const q of players.values()) {
      if (q !== p && inRed(q.x) && dist(p, q) <= r) out.push({ kind: 'pl', e: q, d: dist(p, q) });
    }
  }
  return out.sort((a, b) => a.d - b.d);
}
function hit(p, target, dmg) {
  if (target.kind === 'mob') hurtMob(target.e, dmg, p); else hurtPlayer(target.e, dmg, p);
}

// ---------- poderes personalizados (las reglas viven en powers.js) ----------
const POWER_INIT = { parts: Pw.PARTS, modMax: Pw.MOD_MAX, modCost: Pw.MOD_COST, max: Pw.MAX_POWERS, forge: Pw.FORGE_COST, pvp: Pw.PVP_MUL, tree: Pw.TREE, refund: Pw.FORJA_REFUND };
const flagsOf = (e, now) => (now < (e.slowUntil || 0) ? 2 : 0);
function powersView(a) { return (a.powers || []).map((c, i) => ({ ...c, i, cost: Pw.powerCost(c), st: Pw.powerStats(c, a.lvl) })); }

function castPower(p, ws, slot, now) {
  const a = p.acct, idx = (a.bar || [])[slot], c = idx == null ? null : (a.powers || [])[idx];
  if (!c) return send(ws, { t: 'msg', m: 'Ese espacio no tiene poder. Equipa uno en Menú > Poderes.' });
  const key = 'p' + idx;
  if (now < (p.cd[key] || 0) || now < (p.cd.pg || 0)) return;
  const st = Pw.powerStats(c, a.lvl);
  if (p.mp < st.mp) return send(ws, { t: 'msg', m: 'Sin energía' });
  const mhp = mhpOf(a), S = Pw.PARTS.src[c.src], E = Pw.PARTS.eff[c.eff], SH = Pw.PARTS.shape[c.shape];
  let targets = [];
  if (c.eff !== 'curar') {
    let near = enemiesNear(p, st.range);
    if (c.shape === 'cono') near = near.filter((t) => { const dx = t.e.x - p.x, dy = t.e.y - p.y, d = Math.hypot(dx, dy) || 1; return d < 0.6 || (dx * p.fx + dy * p.fy) / d >= 0.55; });
    targets = near.slice(0, SH.n);
    if (!targets.length) return send(ws, { t: 'msg', m: 'Sin objetivo a tu alcance' });
  }
  p.mp -= st.mp; p.cd[key] = now + st.cd; p.cd.pg = now + Pw.POWER_GCD;
  if (st.hpcost) p.hp = Math.max(1, p.hp - Math.round(mhp * st.hpcost));
  events.push({ t: 'pw', sh: c.shape, src: c.src, x: p.x, y: p.y, dx: p.fx, dy: p.fy, r: st.range, tg: targets.slice(0, 4).map((t) => [t.e.x, t.e.y]) });
  let dealt = 0;
  for (const t of targets) {
    const e = t.e, isPl = t.kind === 'pl';
    let dmg = st.dmg;
    if (isPl) dmg = Math.min(Math.round(dmg * Pw.PVP_MUL), Math.round(Pw.POWER_DMG_CAP * mhpOf(e.acct)));
    const deaths = e.deaths || 0;
    if (dmg > 0) { if (isPl) hurtPlayer(e, dmg, p); else hurtMob(e, dmg, p); dealt += dmg; }
    if (isPl ? (e.deaths || 0) !== deaths : !e.alive) continue;
    const slowMs = E.slow || (S.slow ? 1500 : 0), slowBy = Math.max(S.slow || 0, E.slow ? 0.4 : 0);
    if (slowMs) { e.slowUntil = Math.max(e.slowUntil || 0, now + slowMs); e.slowMul = 1 - slowBy; }
    const push = Math.min(3.5, (S.push || 0) + (E.push || 0)) * (isPl ? 0.6 : 1);
    if (push) {
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1;
      e.x = clamp(e.x + dx / d * push, 0.5, W - 0.5); e.y = clamp(e.y + dy / d * push, 0.5, H - 0.5);
    }
  }
  let heal = (E.heal ? st.heal * mhp : 0) + (E.leech ? E.leech * dealt : 0);
  heal = Math.min(Math.round(heal), Math.round(Pw.POWER_HEAL_CAP * mhp));
  if (heal > 0) { p.hp = Math.min(mhp, p.hp + heal); events.push({ t: 'heal', x: p.x, y: p.y, v: heal }); }
  p.dirty = true;
}

// ---------- mensajes del cliente ----------
const lastChat = new WeakMap();
function handle(ws, p, msg) {
  const now = Date.now();
  switch (msg.t) {
    case 'in': {
      let dx = +msg.dx || 0, dy = +msg.dy || 0;
      const l = Math.hypot(dx, dy);
      if (l > 1) { dx /= l; dy /= l; }
      p.dx = dx; p.dy = dy; p.lastIn = now;
      if (l > 0.1) { p.fx = dx / (l || 1); p.fy = dy / (l || 1); }
      break;
    }
    case 'atk': {
      if (now < p.cd.atk) return;
      p.cd.atk = now + 500;
      const t = enemiesNear(p, 2)[0];
      events.push({ t: 'swing', x: p.x, y: p.y, id: p.id });
      if (t) hit(p, t, baseDmg(p));
      break;
    }
    case 'sk': { // Tajo: área
      if (now < p.cd.sk || p.mp < 20) return;
      p.cd.sk = now + 3000; p.mp -= 20; p.dirty = true;
      events.push({ t: 'slash', x: p.x, y: p.y });
      for (const t of enemiesNear(p, 2.8)) hit(p, t, baseDmg(p) * 2);
      break;
    }
    case 'dash': {
      if (now < p.cd.dash || p.mp < 15) return;
      p.cd.dash = now + 4000; p.mp -= 15; p.dirty = true;
      p.x = clamp(p.x + p.fx * 4, 0.5, W - 0.5); p.y = clamp(p.y + p.fy * 4, 0.5, H - 0.5);
      break;
    }
    case 'gather': {
      if (now < p.cd.gather) return;
      p.cd.gather = now + 600;
      // 1) bolsa de loot cercana
      const bi = bags.findIndex((b) => dist(p, b) < 1.8);
      if (bi >= 0) {
        const b = bags.splice(bi, 1)[0];
        for (const k in b.items) addItem(p.acct, k, b.items[k]);
        p.acct.silver += b.silver; p.dirty = true;
        send(ws, { t: 'msg', m: 'Recogiste una bolsa de botín.' });
        return;
      }
      // 2) recurso cercano
      let best = null, bd = 1.9;
      for (const r of resources) if (r.alive && dist(p, r) < bd) { best = r; bd = dist(p, r); }
      if (!best) return;
      best.hp--;
      events.push({ t: 'chop', x: best.x, y: best.y });
      if (best.hp <= 0) {
        best.alive = false; best.respawn = now + 30000;
        const item = best.t === 'tree' ? 'wood' : best.t === 'rock' ? 'stone' : 'ore';
        addItem(p.acct, item, 1 + Math.floor(rnd() * 2));
        addXp(p, 2); p.dirty = true;
      }
      break;
    }
    case 'craft': {
      const r = RECIPES[msg.item]; if (!r) return;
      for (const k in r) if ((p.acct.inv[k] || 0) < r[k]) return send(ws, { t: 'msg', m: 'Te faltan materiales.' });
      if ((msg.item === 'espada' || msg.item === 'armadura') && p.acct.inv[msg.item] > 0)
        return send(ws, { t: 'msg', m: 'Ya tienes ese equipo.' });
      for (const k in r) addItem(p.acct, k, -r[k]);
      addItem(p.acct, msg.item, 1); addXp(p, 3); p.dirty = true;
      send(ws, { t: 'msg', m: 'Fabricaste: ' + msg.item });
      if (rnd() < Pw.FORJA_REFUND) { for (const k in r) addItem(p.acct, k, r[k]); send(ws, { t: 'msg', m: 'Forja: recuperaste los materiales' }); }
      break;
    }
    case 'potion': {
      if (now < p.cd.pot || !(p.acct.inv.pocion > 0)) return;
      p.cd.pot = now + 1000; addItem(p.acct, 'pocion', -1);
      p.hp = Math.min(mhpOf(p.acct), p.hp + 60); p.dirty = true;
      events.push({ t: 'heal', x: p.x, y: p.y, v: 60 });
      break;
    }
    case 'sell': {
      if (inRed(p.x)) return send(ws, { t: 'msg', m: 'El mercado solo funciona en la ciudad segura.' });
      const item = msg.item, qty = Math.floor(+msg.qty), price = Math.floor(+msg.price);
      if (!ITEMS.includes(item) || !(qty > 0) || !(price > 0) || price > 1e6) return;
      if ((p.acct.inv[item] || 0) < qty) return send(ws, { t: 'msg', m: 'No tienes suficiente.' });
      addItem(p.acct, item, -qty);
      listings.push({ id: newId(), seller: p.acct.name, item, qty, price });
      p.dirty = true; broadcast({ t: 'market', list: listings });
      break;
    }
    case 'buy': {
      if (inRed(p.x)) return send(ws, { t: 'msg', m: 'El mercado solo funciona en la ciudad segura.' });
      const i = listings.findIndex((l) => l.id === msg.id); if (i < 0) return;
      const l = listings[i];
      if (p.acct.silver < l.price) return send(ws, { t: 'msg', m: 'No tienes plata suficiente.' });
      listings.splice(i, 1);
      p.acct.silver -= l.price; addItem(p.acct, l.item, l.qty);
      const seller = getAcct(l.seller);
      seller.silver += Math.floor(l.price * 0.95); // 5% de impuesto
      for (const q of players.values()) if (q.acct === seller) q.dirty = true;
      p.dirty = true; broadcast({ t: 'market', list: listings });
      break;
    }
    case 'cancel': {
      const i = listings.findIndex((l) => l.id === msg.id && l.seller === p.acct.name); if (i < 0) return;
      const l = listings.splice(i, 1)[0]; addItem(p.acct, l.item, l.qty);
      p.dirty = true; broadcast({ t: 'market', list: listings });
      break;
    }
    case 'pprev': {
      if (now - (p.lastPrev || 0) < 100) return; p.lastPrev = now;
      const c = Pw.cleanPower(msg.def);
      if (!c) return send(ws, { t: 'pprev', r: { ok: false, err: 'Poder inválido' } });
      const cost = Pw.powerCost(c), budget = Pw.powerBudget(p.acct.lvl);
      send(ws, { t: 'pprev', r: { ok: cost <= budget, err: cost > budget ? 'Te pasas del presupuesto de puntos' : '', cost, budget, st: Pw.powerStats(c, p.acct.lvl) } });
      break;
    }
    case 'pcreate': {
      const a = p.acct, c = Pw.cleanPower(msg.def);
      if (!c) return send(ws, { t: 'msg', m: 'Poder inválido' });
      a.powers = a.powers || [];
      if (a.powers.length >= Pw.MAX_POWERS) return send(ws, { t: 'msg', m: 'Ya tienes el máximo de poderes. Borra alguno.' });
      if (Pw.powerCost(c) > Pw.powerBudget(a.lvl)) return send(ws, { t: 'msg', m: 'Te pasas del presupuesto de puntos' });
      const F = Pw.FORGE_COST;
      if ((a.inv.nucleo || 0) < F.nucleo || a.silver < F.silver) return send(ws, { t: 'msg', m: `Forjar cuesta ${F.nucleo} núcleo y ${F.silver} de plata` });
      addItem(a, 'nucleo', -F.nucleo); a.silver -= F.silver;
      if (!c.name) c.name = Pw.defaultPowerName(c);
      a.powers.push(c);
      a.bar = a.bar || [null, null, null];
      const free = a.bar.indexOf(null); if (free >= 0) a.bar[free] = a.powers.length - 1;
      p.dirty = true; send(ws, { t: 'msg', m: 'Forjaste: ' + c.name });
      break;
    }
    case 'pdel': {
      const a = p.acct, i = Math.floor(+msg.i);
      if (!a.powers || !a.powers[i]) return;
      a.powers.splice(i, 1);
      a.bar = (a.bar || [null, null, null]).map((b) => (b === i ? null : b != null && b > i ? b - 1 : b));
      p.dirty = true;
      break;
    }
    case 'pbar': {
      const a = p.acct, slot = Math.floor(+msg.slot), i = msg.i == null ? null : Math.floor(+msg.i);
      if (!(slot >= 0 && slot < 3)) return;
      if (i !== null && !(a.powers && a.powers[i])) return;
      a.bar = a.bar || [null, null, null];
      if (i !== null) a.bar = a.bar.map((b) => (b === i ? null : b));
      a.bar[slot] = i; p.dirty = true;
      break;
    }
    case 'pcast': {
      const slot = Math.floor(+msg.slot);
      if (slot >= 0 && slot < 3) castPower(p, ws, slot, now);
      break;
    }
    case 'chat': {
      if (now - (lastChat.get(ws) || 0) < 700) return;
      lastChat.set(ws, now);
      const m = String(msg.m || '').slice(0, 100).trim(); if (!m) return;
      broadcast({ t: 'chat', n: p.acct.name, m });
      break;
    }
  }
}


// Conexión simulada: el cliente cree que habla con un WebSocket.
function serverConnect(ws){
  let p = null;
  return (raw) => {
    let msg; try { msg = JSON.parse(raw); } catch(e){ return; }
    if (!p) {
      if (msg.t !== 'join') return;
      const name = String(msg.name || '').replace(/[^\p{L}\p{N}_\- ]/gu, '').trim().slice(0, 12);
      if (!name) return send(ws, { t: 'err', m: 'Nombre inválido' });
      const acct = getAcct(name), s = spawnPoint();
      p = { ws, id: newId(), acct, x: s.x, y: s.y, hp: mhpOf(acct), mp: mmpOf(acct), dx: 0, dy: 0, fx: 1, fy: 0,
        lastIn: Date.now(), cd: { atk: 0, sk: 0, dash: 0, gather: 0, pot: 0 }, dirty: true };
      players.set(ws, p);
      send(ws, { t: 'init', id: p.id, W, H, SAFE_X, recipes: RECIPES, items: ITEMS, pp: POWER_INIT, res: resources.map((r) => ({ id: r.id, t: r.t, x: r.x, y: r.y })) });
      send(ws, { t: 'market', list: listings });
      return;
    }
    handle(ws, p, msg);
  };
}
// ---------- bucle principal ----------
let tickN = 0, last = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min(0.1, (now - last) / 1000); last = now; tickN++;

  for (const p of players.values()) {
    if (now - p.lastIn > 1000) { p.dx = 0; p.dy = 0; }
    const sp = SPEED * (now < (p.slowUntil || 0) ? (p.slowMul || 0.6) : 1);
    p.x = clamp(p.x + p.dx * sp * dt, 0.5, W - 0.5);
    p.y = clamp(p.y + p.dy * sp * dt, 0.5, H - 0.5);
    const mh = mhpOf(p.acct), mm = mmpOf(p.acct);
    if (p.hp < mh) p.hp = Math.min(mh, p.hp + 1 * dt);
    if (p.mp < mm) p.mp = Math.min(mm, p.mp + 3 * dt);
  }

  for (const m of mobs) {
    if (!m.alive) { if (now >= m.respawn) { m.alive = true; m.hp = m.mhp; m.x = m.hx; m.y = m.hy; m.slowUntil = 0; } continue; }
    const mf = now < (m.slowUntil || 0) ? (m.slowMul || 0.6) : 1;
    let target = null, td = 7;
    for (const p of players.values()) { const d = dist(m, p); if (d < td && inRed(p.x)) { td = d; target = p; } }
    if (target && dist(m, { x: m.hx, y: m.hy }) < 14) {
      if (td > 1.2) { m.x += ((target.x - m.x) / td) * 3 * mf * dt; m.y += ((target.y - m.y) / td) * 3 * mf * dt; }
      else if (now >= m.cd) { m.cd = now + 1000; hurtPlayer(target, 8, null); }
    } else {
      const hd = dist(m, { x: m.hx, y: m.hy });
      if (hd > 0.5) { m.x += ((m.hx - m.x) / hd) * 2 * mf * dt; m.y += ((m.hy - m.y) / hd) * 2 * mf * dt; }
    }
  }

  for (const r of resources) if (!r.alive && now >= r.respawn) { r.alive = true; r.hp = r.t === 'ore' ? 4 : 3; }
  for (let i = bags.length - 1; i >= 0; i--) if (now > bags[i].expires) bags.splice(i, 1);

  if (tickN % 2 === 0 && players.size) { // 10 Hz
    const snap = {
      t: 's',
      p: [...players.values()].map((p) => ({ id: p.id, n: p.acct.name, x: +p.x.toFixed(2), y: +p.y.toFixed(2), hp: Math.round(p.hp), mh: mhpOf(p.acct), l: p.acct.lvl, sw: p.acct.inv.espada > 0 ? 1 : 0, fl: flagsOf(p, now) })),
      m: mobs.filter((m) => m.alive).map((m) => ({ id: m.id, x: +m.x.toFixed(2), y: +m.y.toFixed(2), hp: m.hp, mh: m.mhp, fl: flagsOf(m, now) })),
      d: resources.filter((r) => !r.alive).map((r) => r.id),
      b: bags.map((b) => ({ id: b.id, x: b.x, y: b.y })),
      e: events,
    };
    events = [];
    broadcast(snap);
    for (const [ws, p] of players) {
      if (p.dirty) {
        p.dirty = false;
        send(ws, { t: 'me', inv: p.acct.inv, silver: p.acct.silver, xp: p.acct.xp, lvl: p.acct.lvl,
          hp: Math.round(p.hp), mh: mhpOf(p.acct), mp: Math.round(p.mp), mm: mmpOf(p.acct), nx: p.acct.lvl * 40,
          pw: powersView(p.acct), bar: p.acct.bar || [null, null, null], pb: Pw.powerBudget(p.acct.lvl) });
      }
    }
  }
  // mp/hp cambian de forma continua: refrescar 'me' cada 1s
  if (tickN % 20 === 0) for (const p of players.values()) p.dirty = true;
}, TICK);


window.WebSocket = function(){
  const c = { readyState: 0, onopen: null, onclose: null, onmessage: null };
  const s = { readyState: 1, send(d){ setTimeout(() => c.onmessage && c.onmessage({ data: d }), 0); },
    close(){ c.readyState = 3; c.onclose && c.onclose(); } };
  const handler = serverConnect(s);
  c.send = (raw) => handler(raw);
  c.close = () => { players.delete(s); };
  setTimeout(() => { c.readyState = 1; c.onopen && c.onopen(); }, 0);
  return c;
};
})();

<script>
// ================== Configuración ==================
const TW = 64, TH = 32;
const NAMES = { wood: 'Madera', stone: 'Piedra', ore: 'Mineral', nucleo: 'Núcleo de energía', espada: 'Espada', armadura: 'Armadura', pocion: 'Poción' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
addEventListener('resize', resize); resize();

// ================== Estado ==================
let ws = null, myId = null, W = 100, H = 100, SAFE_X = 30, recipes = {}, items = [];
let resList = [], deadRes = new Set();
const players = new Map(), mobs = new Map();
let bags = [], fx = [], me = { inv: {}, silver: 0, xp: 0, lvl: 1, hp: 100, mh: 100, mp: 50, mm: 50, nx: 40 };
let market = [], zoomK = 1;
let cd = { sk: 0, dash: 0, atk: 0 };
let pp = null, cdP = [0, 0, 0], prev = null, prevT = null, lastPSig = '';
let draft = { name: '', src: 'fuego', shape: 'proyectil', eff: 'dano', mods: { alcance: 0, potencia: 0, rapidez: 0, eficiencia: 0 } };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const srcCol = (k) => (pp && pp.parts.src[k] ? pp.parts.src[k].color : '#fff');

const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });
function toast(m, t = 2200) { const e = document.getElementById('toast'); e.textContent = m; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', t); }

// ================== Conexión ==================
function connect(name) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = window.SERVER_URL || (proto + '//' + location.host);
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', name }));
  ws.onclose = () => { document.getElementById('login').style.display = 'flex'; document.getElementById('loginErr').textContent = 'Desconectado del servidor'; };
  ws.onmessage = (ev) => onMsg(JSON.parse(ev.data));
}
const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

function onMsg(m) {
  switch (m.t) {
    case 'init':
      myId = m.id; W = m.W; H = m.H; SAFE_X = m.SAFE_X; recipes = m.recipes; items = m.items; resList = m.res; pp = m.pp;
      document.getElementById('login').style.display = 'none'; break;
    case 'err': document.getElementById('loginErr').textContent = m.m; document.getElementById('login').style.display = 'flex'; break;
    case 'me': me = m; hud(); powerBtns();
      if (panelOpen) { if (tab === 'powers') { if (powersSig() !== lastPSig) renderPanel(); } else renderPanel(); } break;
    case 'pprev': prev = m.r; updatePrev(); break;
    case 'market': market = m.list; if (panelOpen && tab === 'market') renderPanel(); break;
    case 'msg': toast(m.m); break;
    case 'chat': {
      const d = document.createElement('div'); d.textContent = m.n + ': ' + m.m;
      const l = document.getElementById('chatlog'); l.appendChild(d); while (l.children.length > 6) l.removeChild(l.firstChild);
      setTimeout(() => d.remove(), 12000); break;
    }
    case 's': {
      const seen = new Set();
      for (const p of m.p) {
        seen.add(p.id); let o = players.get(p.id);
        if (!o) { o = { rx: p.x, ry: p.y }; players.set(p.id, o); }
        Object.assign(o, p);
      }
      for (const id of players.keys()) if (!seen.has(id)) players.delete(id);
      const seenM = new Set();
      for (const q of m.m) {
        seenM.add(q.id); let o = mobs.get(q.id);
        if (!o) { o = { rx: q.x, ry: q.y }; mobs.set(q.id, o); }
        Object.assign(o, q);
      }
      for (const id of mobs.keys()) if (!seenM.has(id)) mobs.delete(id);
      deadRes = new Set(m.d); bags = m.b;
      for (const e of m.e) fx.push({ ...e, born: performance.now() });
      break;
    }
  }
}

// ================== Entrada ==================
let kx = 0, ky = 0, jx = 0, jy = 0, lastSent = '';
const keys = {};
addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') {
    if (e.key === 'Enter' && document.activeElement.id === 'chatin') { const v = e.target.value.trim(); if (v) send({ t: 'chat', m: v }); e.target.value = ''; closeChat(); }
    if (e.key === 'Escape') closeChat();
    return;
  }
  keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'j') act('atk'); if (k === 'k') act('sk'); if (k === 'l') act('dash');
  if (k === '1' || k === '2' || k === '3') act('p' + (+k - 1)); if (k === 'e') act('gather'); if (k === 'q') act('potion'); if (k === 'b') togglePanel(); if (k === 'enter') openChat();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
function act(a) {
  const n = performance.now();
  if (a === 'atk') send({ t: 'atk' });
  if (a === 'sk') { send({ t: 'sk' }); cd.sk = n + 3000; }
  if (a === 'dash') { send({ t: 'dash' }); cd.dash = n + 4000; }
  if (a === 'gather') send({ t: 'gather' });
  if (a === 'potion') send({ t: 'potion' });
  if (a.length === 2 && a[0] === 'p') castSlot(+a[1]);
}
function castSlot(i) {
  const idx = me.bar && me.bar[i], d = idx != null && me.pw ? me.pw[idx] : null;
  if (!d) { if (!panelOpen) togglePanel(); tab = 'powers'; syncTabs(); renderPanel(); return; }
  send({ t: 'pcast', slot: i }); cdP[i] = performance.now() + d.st.cd;
}
// pantalla -> mundo
function scr2world(sx, sy) { const x = (sx / (TW / 2) + sy / (TH / 2)) / 2, y = (sy / (TH / 2) - sx / (TW / 2)) / 2; const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }
function updateInput() {
  let sx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let sy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (!sx && !sy) { sx = jx; sy = jy; }
  let dx = 0, dy = 0;
  if (Math.hypot(sx, sy) > 0.15) { const l = Math.hypot(sx, sy), mag = Math.min(1, l); [dx, dy] = scr2world(sx / l, sy / l); dx *= mag; dy *= mag; }
  const s = dx.toFixed(2) + ',' + dy.toFixed(2);

// ================== Render ==================
function hashColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return `hsl(${Math.abs(h) % 360},65%,55%)`; }
function diamond(sx, sy, fill) {
  ctx.beginPath(); ctx.moveTo(sx, sy - TH / 2); ctx.lineTo(sx + TW / 2, sy); ctx.lineTo(sx, sy + TH / 2); ctx.lineTo(sx - TW / 2, sy); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
function bar(sx, sy, w, p, col) { ctx.fillStyle = '#000a'; ctx.fillRect(sx - w / 2, sy, w, 5); ctx.fillStyle = col; ctx.fillRect(sx - w / 2, sy, w * Math.max(0, Math.min(1, p)), 5); }

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  updateInput();
  const k = 1 - Math.pow(0.0005, dt); // suavizado
  for (const o of players.values()) { o.rx += (o.x - o.rx) * k; o.ry += (o.y - o.ry) * k; }
  for (const o of mobs.values()) { o.rx += (o.x - o.rx) * k; o.ry += (o.y - o.ry) * k; }
  draw(t);
  requestAnimationFrame(frame);
}

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#10141a'; ctx.fillRect(0, 0, VW, VH);
  const mp = players.get(myId);
  if (!mp) return;
  const sc = Math.max(0.7, Math.min(1.3, Math.min(VW, VH) / 520)) * zoomK;
  const cam = iso(mp.rx, mp.ry);
  ctx.save(); ctx.translate(VW / 2, VH / 2); ctx.scale(sc, sc); ctx.translate(-cam.x, -cam.y);

  // tiles visibles
  const R = Math.ceil(Math.max(VW, VH) / sc / TH) + 3;
  const cx = Math.floor(mp.rx), cy = Math.floor(mp.ry);
  for (let ty = cy - R; ty <= cy + R; ty++) for (let tx = cx - R; tx <= cx + R; tx++) {
    if (tx < 0 || ty < 0 || tx >= W || ty >= H) continue;
    const p = iso(tx + 0.5, ty + 0.5); const sx = p.x, sy = p.y;
    if (Math.abs(sx - cam.x) > VW / sc / 2 + TW || Math.abs(sy - cam.y) > VH / sc / 2 + TH) continue;
    const chk = (tx + ty) & 1;
    let col;
    if (tx < SAFE_X) col = chk ? '#3f7d45' : '#437f4a'; else col = chk ? '#6b3b36' : '#703f3a';
    if (tx === SAFE_X) col = '#c9a227';
    diamond(sx, sy, col);
  }

  // entidades ordenadas por profundidad
  const ents = [];
  for (const r of resList) if (!deadRes.has(r.id)) ents.push({ z: r.x + r.y, k: 'res', o: r });
  for (const b of bags) ents.push({ z: b.x + b.y, k: 'bag', o: b });
  for (const m of mobs.values()) ents.push({ z: m.rx + m.ry, k: 'mob', o: m });
  for (const p of players.values()) ents.push({ z: p.rx + p.ry, k: 'pl', o: p });
  ents.sort((a, b) => a.z - b.z);
  for (const e of ents) {
    const o = e.o;
    if (e.k === 'res') drawRes(o); else if (e.k === 'bag') drawBag(o, t); else if (e.k === 'mob') drawMob(o, t); else drawPlayer(o, t);
  }
  // efectos
  const now = performance.now();
  fx = fx.filter((f) => now - f.born < 900);
  for (const f of fx) {
    const age = (now - f.born) / 900, p = iso(f.x, f.y);
    if (f.t === 'dmg' || f.t === 'heal') {
      ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = f.t === 'heal' ? `rgba(120,255,140,${1 - age})` : `rgba(255,235,90,${1 - age})`;
      ctx.strokeStyle = `rgba(0,0,0,${1 - age})`; ctx.lineWidth = 3;
      const txt = (f.t === 'heal' ? '+' : '-') + f.v; ctx.strokeText(txt, p.x, p.y - 40 - age * 30); ctx.fillText(txt, p.x, p.y - 40 - age * 30);
    } else if (f.t === 'slash') {
      ctx.strokeStyle = `rgba(160,220,255,${1 - age})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(p.x, p.y, 2.8 * TW / 2 * (0.4 + age), 2.8 * TH / 2 * (0.4 + age), 0, 0, 7); ctx.stroke();
    } else if (f.t === 'chop') {
      ctx.fillStyle = `rgba(255,255,255,${1 - age})`; for (let i = 0; i < 4; i++) ctx.fillRect(p.x - 12 + i * 8, p.y - 30 - age * 12 * (i % 2 + 1), 3, 3);
    } else if (f.t === 'pw') {
      const col = srcCol(f.src), al = 1 - age;
      ctx.save(); ctx.globalAlpha = Math.max(0, al); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 4;
      if (f.sh === 'area') {
        const k = Math.min(1, 0.25 + age * 1.2); ctx.beginPath(); ctx.ellipse(p.x, p.y, f.r * TW / 2 * 1.414 * k, f.r * TH / 2 * 1.414 * k, 0, 0, 7); ctx.stroke();
        ctx.globalAlpha = Math.max(0, al) * 0.2; ctx.fill();
      } else {
        if (f.sh === 'cono') {
          const a0 = Math.atan2(f.dy, f.dx); ctx.beginPath(); ctx.moveTo(p.x, p.y);
          for (let i = -4; i <= 4; i++) { const an = a0 + i * 0.14, q = iso(f.x + Math.cos(an) * f.r, f.y + Math.sin(an) * f.r); ctx.lineTo(q.x, q.y); }
          ctx.closePath(); ctx.globalAlpha = Math.max(0, al) * 0.3; ctx.fill(); ctx.globalAlpha = Math.max(0, al); ctx.stroke();
        }
        for (const t of f.tg || []) {
          const q = iso(t[0], t[1]); ctx.beginPath(); ctx.moveTo(p.x, p.y - 18); ctx.lineTo(q.x, q.y - 14); ctx.stroke();
          ctx.beginPath(); ctx.arc(q.x, q.y - 14, 6 + age * 10, 0, 7); ctx.fill();
        }
      }
      ctx.restore();
    } else if (f.t === 'death') {
      ctx.fillStyle = `rgba(255,60,60,${1 - age})`; ctx.font = '22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('☠', p.x, p.y - 20 - age * 30);
    }
  }
  ctx.restore();

  // minimapa
  const mw = 90, mx = VW - mw - 8, my = VH - mw - 190; // sobre los botones
  if (VH > 420) {
    ctx.fillStyle = '#0009'; ctx.fillRect(mx, my, mw, mw);
    ctx.fillStyle = '#2c5a30'; ctx.fillRect(mx, my, mw * SAFE_X / W, mw);
    ctx.fillStyle = '#5a2c28'; ctx.fillRect(mx + mw * SAFE_X / W, my, mw * (1 - SAFE_X / W), mw);
    for (const p of players.values()) { ctx.fillStyle = p.id === myId ? '#fff' : '#6cf'; ctx.fillRect(mx + p.x / W * mw - 1, my + p.y / H * mw - 1, 3, 3); }
  }
  // cooldowns en botones
  const n = performance.now();
  document.getElementById('bSk').style.opacity = n < cd.sk ? .45 : 1;
  document.getElementById('bDash').style.opacity = n < cd.dash ? .45 : 1;
  for (let i = 0; i < 3; i++) document.getElementById('bP' + i).style.opacity = n < cdP[i] ? .45 : 1;
  const zEl = document.getElementById('zone'), red = mp.x >= SAFE_X;
  zEl.textContent = red ? '⚠ ZONA DE LA MUERTE — PvP y full loot' : 'Ciudad segura'; zEl.classList.toggle('red', red);
}

function flagIcons(x, y, fl) { if (!fl) return; ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(fl & 2 ? '❄️' : '', x, y); }
function drawRes(r) {
  const p = iso(r.x, r.y);
  ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 14, 7, 0, 0, 7); ctx.fill();
  if (r.t === 'tree') {
    ctx.fillStyle = '#5b3a1e'; ctx.fillRect(p.x - 4, p.y - 22, 8, 22);
    ctx.fillStyle = '#2e8b3e'; ctx.beginPath(); ctx.arc(p.x, p.y - 32, 17, 0, 7); ctx.fill();
    ctx.fillStyle = '#3aa64c'; ctx.beginPath(); ctx.arc(p.x - 5, p.y - 36, 9, 0, 7); ctx.fill();
  } else if (r.t === 'rock') {
    ctx.fillStyle = '#8a8f98'; ctx.beginPath(); ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x - 8, p.y - 16); ctx.lineTo(p.x + 6, p.y - 18); ctx.lineTo(p.x + 14, p.y); ctx.closePath(); ctx.fill();
